<!doctype html>
<html><head><meta charset="utf-8"><title>ispeziona</title></head>
<body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

const ARMI = '/_lavoro/scaricati/armi/estratti/Ultimate Gun Pack - July 2019/FBX/';
const NOMI = ['AssaultRifle_1', 'Pistol_1', 'Shotgun_1', 'SniperRifle_1', 'SubmachineGun_1', 'Revolver_1', 'Bullpup_1', 'Shotgun_SawedOff'];
const ALIENE = '/_lavoro/scaricati/scifi/estratti/glTF/';
const NOMI_ALIENE = ['Gun_Pistol', 'Gun_Revolver', 'Gun_Rifle', 'Gun_Sniper'];
const ZOMBIE = '/_lavoro/scaricati/zombie_kit/';
const NOMI_ZOMBIE = ['Zombie_Basic', 'Zombie_Chubby', 'Zombie_Ribcage', 'Zombie_Arm', 'Cane'];

function dati(oggetto) {
  const scatola = new THREE.Box3().setFromObject(oggetto);
  const dim = scatola.getSize(new THREE.Vector3());
  const materiali = new Set();
  let vertici = 0;
  oggetto.traverse(o => {
    if (!o.isMesh) return;
    vertici += o.geometry.attributes.position.count;
    for (const m of [].concat(o.material)) materiali.add(`${m.name}:${m.color?.getHexString()}:${m.map ? 'map' : ''}:${o.geometry.attributes.color ? 'vc' : ''}`);
  });
  return { dim: dim.toArray().map(v => +v.toFixed(3)), min: scatola.min.toArray().map(v => +v.toFixed(3)), scala: oggetto.scale.toArray(), vertici, materiali: [...materiali].slice(0, 6) };
}

window.ispeziona = async () => {
  const esito = {};
  const fbx = new FBXLoader();
  const gltf = new GLTFLoader();
  const scena = new THREE.Scene();
  scena.background = new THREE.Color(0xdddddd);
  scena.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.5));
  let i = 0;
  for (const n of NOMI) {
    const o = await fbx.loadAsync(ARMI + n + '.fbx');
    esito[n] = dati(o);
    const s = new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3());
    const k = 1 / Math.max(s.x, s.y, s.z);
    o.scale.multiplyScalar(k);
    o.position.set((i % 4) * 1.3 - 2, Math.floor(i / 4) * -1 + 0.5, 0);
    o.add(new THREE.AxesHelper(0.6 / k));
    scena.add(o);
    i += 1;
  }
  for (const n of NOMI_ALIENE) esito[n] = dati((await gltf.loadAsync(ALIENE + n + '.gltf')).scene);
  for (const n of NOMI_ZOMBIE) {
    const g = await gltf.loadAsync(ZOMBIE + n + '.gltf');
    esito[n] = { ...dati(g.scene), animazioni: g.animations.length };
  }
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(1400, 700);
  document.body.appendChild(renderer.domElement);
  const camera = new THREE.PerspectiveCamera(35, 2, 0.1, 100);
  camera.position.set(0, 0, 7);
  renderer.render(scena, camera);
  return { esito, immagine: renderer.domElement.toDataURL('image/png') };
};
window.pronto = true;
</script>
</body></html>
